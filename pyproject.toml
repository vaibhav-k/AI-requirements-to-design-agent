[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "requirements-agent"
version = "0.2.0"
description = "AI agent that transforms software requirements into high-level system architecture."
requires-python = ">=3.11"

[tool.pyright]
ignoreMissingImports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.mypy]
# Matches `requires-python` above and ruff's `target-version` below — the
# lowest Python version this project actually supports, not whatever
# happens to be installed wherever mypy is run. CI runs on 3.12, which is a
# compatible superset of 3.11 for type-checking purposes.
python_version = "3.11"
strict = true
exclude = "^\\.venv/"
warn_unused_ignores = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# FAST added for FastAPI-specific SonarQube-equivalent checks: FAST001
# ("response_model duplicates the return type annotation") and FAST002
# ("use Annotated for FastAPI dependency injection instead of a mutable
# default argument") — both raised by SonarQube against app/api/routes/*.py.
select = ["E", "F", "I", "B", "UP", "FAST"]
# UP046/UP047 ("use PEP 695 type parameter syntax") suggest a
# `class Foo[T]:`/`def foo[T](...)` syntax that only parses on Python
# 3.12+ — this project's `target-version = "py311"` above (matching
# `requires-python = ">=3.11"`) is supposed to suppress both rules, and
# does under the version of ruff this was verified against. They're
# ignored explicitly anyway rather than left to that inference, because
# a ruff install/config that resolves its effective target version
# differently (a newer/older ruff release changing how target-version
# is derived, a global user-level ruff config, an IDE extension running
# its own default) would otherwise "fix" `app/design/comparison.py`'s
# `ListDiffChange`/`ListDiff`/`_diff_by_id` and
# `app/infrastructure/sync_bridge.py`'s `run_sync` into syntax that
# fails to parse for anyone still on 3.11 — silently breaking the
# `>=3.11` support this project advertises. Explicit `ignore` doesn't
# depend on that inference resolving the same way everywhere.
ignore = ["UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[[tool.mypy.overrides]]
module = ["graphviz"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# azure-cosmos and azure-identity ship no inline types/py.typed marker, so
# strict mode would otherwise flag every call into them (create_item,
# CosmosResourceNotFoundError, ManagedIdentityCredential, ...) as untyped.
module = ["azure.cosmos", "azure.cosmos.*", "azure.identity", "azure.identity.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# msal (used only by scripts/get_dev_token.py, a manual-testing helper —
# not imported by the app itself) ships no py.typed marker either.
module = ["msal"]
ignore_missing_imports = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# This project has no direct or transitive dependency on numpy — but
# `openai/_extras/numpy_proxy.py` (imported by `openai.resources
# .embeddings`, which `openai/__init__.py` always loads) does
# `if TYPE_CHECKING: import numpy`, so mypy will still try to resolve and
# fully parse numpy's stubs *if numpy happens to be installed at all* in
# whatever environment mypy runs in — e.g. a dev virtualenv that also has
# numpy for unrelated reasons (data-science tooling, a different project
# sharing the same venv, etc.). Some numpy stub versions use newer syntax
# (PEP 695 `type` aliases) than this project's `python_version = "3.11"`
# target supports, which fails as a hard parse error — "Type statement is
# only supported in Python 3.12 and greater" — and aborts the whole mypy
# run before it checks anything else. `follow_imports = "skip"` stops
# mypy from ever opening numpy's source/stubs (treating the import as
# `Any` instead), which sidesteps this regardless of which numpy version
# happens to be sitting in the environment.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
