# Scopes SonarQube/SonarLint to this service only - see the root README's
# "Static analysis / IDE setup" section for why a single Sonar project
# spanning the whole repo hits the same package-name collision mypy does
# ("app" here vs. backend/tools-service's and backend/mcp-wrapper's own
# top-level "src" package). Run sonar-scanner from inside this directory,
# or configure SonarLint's "bind to project" per folder if using
# connected mode with a server.
sonar.projectKey=ai-requirements-to-design-agent-orchestrator
sonar.projectName=AI Requirements to Design Agent - Orchestrator
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.14
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/.mypy_cache/**,**/.pytest_cache/**,**/.ruff_cache/**
