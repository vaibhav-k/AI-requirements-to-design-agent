[project]
name = "design-tools-service"
version = "0.1.0"
description = "Deterministic architecture-diagram rendering and design validation for the AI Requirements to System Design Agent - see the root README's 'Service Architecture' section."
requires-python = ">=3.12"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = "^\\.venv/"
warn_unused_ignores = true

[[tool.mypy.overrides]]
# graphviz ships no inline types/py.typed marker, so strict mode would
# otherwise flag every call into it (Digraph, .render(), etc.) as
# untyped - same override backend/orchestrator's pyproject.toml carried
# for this exact package before diagram.py moved here.
module = ["graphviz"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# python-docx ships no inline types/py.typed marker either - same
# reasoning as the graphviz override above, needed once
# document_export.py started calling into it.
module = ["docx", "docx.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "FAST"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
